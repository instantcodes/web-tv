<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Malayalam Live TV</title>
    
    <!-- Tailwind CSS for layout styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Plyr CSS for the video player UI -->
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    
    <style>
        /* 100dvh fixes mobile browser URL bar clipping */
        body, html { margin: 0; padding: 0; background: #000; overflow: hidden; height: 100dvh; width: 100vw; }
        #app { display: flex; height: 100dvh; width: 100vw; position: relative; }
        
        /* Sidebar layout & Mobile Drawer transition */
        #sidebar { 
            width: 320px; background: #111; display: flex; flex-direction: column; 
            transition: transform 0.3s ease; z-index: 50; height: 100dvh; border-right: 1px solid #333;
        }
        @media (max-width: 768px) {
            #sidebar { position: absolute; left: 0; top: 0; transform: translateX(-100%); }
            #sidebar.open { transform: translateX(0); }
        }
        
        /* Video Container constraints */
        #main { flex-grow: 1; position: relative; display: flex; flex-direction: column; height: 100dvh; min-width: 0; }
        #video-container { flex-grow: 1; display: flex; align-items: center; justify-content: center; background: #000; min-height: 0; }
        .plyr { width: 100%; height: 100%; }
        
        /* Auto-hide Top Bar */
        #top-bar {
            position: absolute; top: 0; left: 0; right: 0; padding: 15px 20px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
            display: flex; align-items: center; z-index: 40;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        #top-bar.hide { opacity: 0; transform: translateY(-20px); pointer-events: none; }
        
        /* Android TV Remote D-Pad Focus Styles */
        button:focus, input:focus { outline: 3px solid #fff !important; outline-offset: -3px; }
        .channel-btn:focus { background: #dc2626 !important; }
    </style>
</head>
<body>
    <div id="app">
        <!-- Left Sidebar Panel -->
        <div id="sidebar" class="md:transform-none">
            <div class="p-4 bg-red-700 flex justify-between items-center shrink-0">
                <h2 class="text-white font-bold text-lg tracking-wide">Malayalam TV</h2>
                <button id="close-sidebar-mobile" class="md:hidden text-white font-bold text-2xl px-2 leading-none">&times;</button>
            </div>
            
            <div class="p-3 shrink-0 bg-gray-900 border-b border-gray-800">
                <input type="text" id="search-input" placeholder="Search channels..." class="w-full p-2.5 bg-gray-800 text-white rounded border border-gray-700 focus:border-red-500">
            </div>
            
            <div id="channel-list" class="overflow-y-auto flex-grow pb-10">
                <p class="text-gray-400 p-4 text-center">Fetching playlist...</p>
            </div>
        </div>

        <!-- Main Video Area -->
        <div id="main">
            <!-- Overlay Top Bar -->
            <div id="top-bar">
                <button id="toggle-sidebar" class="text-white mr-4 p-2 bg-gray-800/80 rounded hover:bg-gray-700 transition cursor-pointer">
                    <!-- Hamburger Icon -->
                    <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
                <div class="flex-grow">
                    <h1 id="status-text" class="text-white font-semibold text-lg drop-shadow-md">Starting player...</h1>
                </div>
            </div>

            <div id="video-container">
                <video id="tv-player" playsinline controls></video>
            </div>
        </div>
    </div>

    <!-- External Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
    
    <!-- Your Custom Logic -->
    <script src="player.js"></script>
</body>
</html>
